name: Publish extension

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: extension/requirements-build.txt
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build wheel
        working-directory: extension
        run: |
          python -m pip install -r requirements-build.txt
          npm ci
          npm run build
          python -m build --wheel --no-isolation
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: extension/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/csis110-jupyterlab-pairing
    permissions:
      id-token: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v7
        with:
          name: python-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

