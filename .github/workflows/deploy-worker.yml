name: Deploy pairing Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install and validate
        working-directory: worker
        run: |
          npm ci
          npm run check
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Read the database name from wrangler.jsonc rather than repeating it
        # here. Wrangler does not interpolate environment variables into its
        # config, so the config is the only source of truth, and a rename there
        # would otherwise leave this step pointing at a database that no longer
        # exists.
        run: |
          DB_NAME=$(node -e 'const fs=require("fs");const raw=fs.readFileSync("wrangler.jsonc","utf8").replace(/^\s*\/\/.*$/gm,"");process.stdout.write(JSON.parse(raw).d1_databases[0].database_name)')
          echo "Applying migrations to D1 database: $DB_NAME"
          npx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

